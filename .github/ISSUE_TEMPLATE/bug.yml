name: 界面或功能问题 / Bug report
description: 帮助我们复现并修复一个问题。
title: '[Bug] '
body:
  - type: textarea
    id: behavior
    attributes:
      label: 问题与预期 / What happened, and what did you expect?
      description: 请描述具体操作、实际结果与预期结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 可以附上页面链接、搜索关键词或截图。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与浏览器 / Device and browser
      placeholder: '例如：Windows 11 / Chrome，或 iPhone / Safari'
    validations:
      required: true
