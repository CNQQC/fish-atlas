  <link rel="stylesheet" href="tree-view.css?v=20261105-1830">
  <link rel="stylesheet" href="specimen-view.css?v=20261105-1830">
  <link rel="stylesheet" href="catalog-view.css?v=20261105-1830">
  <script defer src="data.js?v=20261105-1830"></script>
  <script defer src="taxonomy.js?v=20261105-1830"></script>

</head>
<body id="graph">
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <symbol id="i-tree" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="5" rx="1.5"/><path d="M12 8v4M5 16v-4h14v4"/><rect x="2" y="16" width="6" height="5" rx="1.5"/><rect x="16" y="16" width="6" height="5" rx="1.5"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.7"/><path d="m15.5 15.5 5 5"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-10-1v14c4-1 7-1 10 1 3-2 6-2 10-1V5c-4-1-7-1-10 1zm0 0v14"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>

</defs></svg>
<a class="skip-link" href="#main">跳到浏览区</a>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#graph" aria-label="鱼间首页">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-tree"/></svg></span>
      <strong>鱼间</strong><span class="brand-en" lang="en">Fish Atlas</span>
    </a>
    <nav class="view-nav" aria-label="主导航">
      <button id="nav-tree" type="button"><svg class="icon"><use href="#i-tree"/></svg>分类树</button>
      <button id="nav-catalog" type="button"><svg class="icon"><use href="#i-grid"/></svg>照片图鉴</button>
    </nav>
    <div class="search-wrap" id="search-wrap" role="search">
      <div class="search-field"><svg class="icon"><use href="#i-search"/></svg><input id="search" type="search" autocomplete="off" role="combobox" aria-label="搜索鱼的名称、学名、分类或分布" aria-controls="search-results" aria-expanded="false" aria-autocomplete="list" placeholder="搜鱼名、学名、分类或分布"><kbd id="search-shortcut">/</kbd><button id="search-clear" type="button" aria-label="清除搜索" hidden>×</button></div>
      <div id="search-popup" class="search-popup" hidden><div id="search-results" role="listbox" aria-label="物种匹配结果"></div><button id="all-results" type="button"></button></div>
    </div>
    <button id="sources-open" class="source-control" type="button"><svg class="icon"><use href="#i-book"/></svg><span>资料与图片来源</span></button>
  </div>
</header>
<main id="main" class="workspace">
  <div class="page-head">
    <h1 id="page-title">鱼类分类图谱</h1><p id="page-lede">沿分支从界读到种，比较鱼类的分类位置。</p>
  </div>
  <section id="tree-screen" aria-label="分类树浏览">
    <div id="atlas-tree"></div>
    <div class="canvas-bar">
      <div class="branch-label"><h2 id="branch-title"></h2><span id="branch-count"></span></div>
      <div class="preset-strip" id="presets" role="group" aria-label="比较分支"></div>
      <label class="branch-select"><span class="sr-only">切换分类分支</span><select id="scope" aria-label="切换分类分支"></select></label>
    </div>
    <div class="specimen-dock">
      <button id="dock-toggle" class="dock-toggle" type="button" aria-controls="specimen-panel" aria-expanded="true" aria-label="收起物种卡片" title="收起物种卡片"><svg class="icon"><use href="#i-chevron"/></svg></button>
      <aside id="specimen-panel" aria-label="选中鱼种快览"></aside>
    </div>
  </section>
  <section id="catalog-screen" aria-label="鱼类照片图鉴" hidden>
    <div class="catalog-filterbar"><div id="water-filters" role="group" aria-label="水域筛选"></div><span id="catalog-query" aria-live="polite"></span><label class="recent-filter"><input id="recent-only" type="checkbox">只看本次新增（<span id="recent-count"></span> 种）</label></div>
    <div id="atlas-catalog"></div>
  </section>
  <footer class="site-footer"><span>分类依据 · WoRMS 分类记录</span><span>收录 <b id="total-count"></b> 种鱼类</span></footer>
</main>
<noscript>请启用浏览器 JavaScript 以展开分类树和鱼类档案。</noscript>
</body>
</html>
